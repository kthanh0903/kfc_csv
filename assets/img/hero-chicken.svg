<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFC72C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFC72C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crispyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="35%" stop-color="#E65100"/>
      <stop offset="70%" stop-color="#BF360C"/>
      <stop offset="100%" stop-color="#870000"/>
    </linearGradient>
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E0E0"/>
    </linearGradient>
    <filter id="crispShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="15" stdDeviation="12" flood-color="#1A1A1A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="250" cy="250" r="210" fill="url(#bgGlow)"/>

  <!-- Steam effects -->
  <path d="M 210 110 Q 220 80 200 50 Q 185 25 195 10" fill="none" stroke="#FFC72C" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M 260 120 Q 275 90 255 60 Q 240 30 250 15" fill="none" stroke="#FFC72C" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <path d="M 310 135 Q 325 105 310 80 Q 295 55 305 35" fill="none" stroke="#FFC72C" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Sparkles -->
  <path d="M 130 160 L 135 145 L 140 160 L 155 165 L 140 170 L 135 185 L 130 170 L 115 165 Z" fill="#FFC72C"/>
  <path d="M 380 180 L 384 168 L 388 180 L 400 184 L 388 188 L 384 200 L 380 188 L 368 184 Z" fill="#FFC72C"/>
  <path d="M 360 340 L 363 330 L 366 340 L 376 343 L 366 346 L 363 356 L 360 346 L 350 343 Z" fill="#FFC72C"/>

  <!-- Main Drumstick Group -->
  <g filter="url(#crispShadow)">
    <!-- Bone End -->
    <path d="M 120 370 L 175 320 L 195 340 L 140 390 Z" fill="url(#boneGrad)"/>
    <circle cx="115" cy="375" r="18" fill="url(#boneGrad)"/>
    <circle cx="135" cy="395" r="18" fill="url(#boneGrad)"/>

    <!-- Drumstick Meat Body -->
    <path d="M 170 325 
             C 145 285 140 230 170 185 
             C 205 135 275 125 330 160 
             C 385 195 400 265 375 320 
             C 350 370 280 395 220 365 
             C 195 350 180 340 170 325 Z" 
          fill="url(#crispyGold)"/>

    <!-- Crispy Crunch Texture & Flakes -->
    <!-- Crunch flakes -->
    <circle cx="215" cy="220" r="14" fill="#FFA000" opacity="0.7"/>
    <circle cx="270" cy="180" r="16" fill="#FFA000" opacity="0.7"/>
    <circle cx="330" cy="225" r="18" fill="#FFA000" opacity="0.7"/>
    <circle cx="280" cy="270" r="22" fill="#FFA000" opacity="0.6"/>
    <circle cx="310" cy="315" r="15" fill="#FFA000" opacity="0.6"/>
    <circle cx="225" cy="310" r="16" fill="#FFA000" opacity="0.6"/>

    <path d="M 230 170 Q 250 160 270 175" fill="none" stroke="#FFE082" stroke-width="4" stroke-linecap="round"/>
    <path d="M 300 200 Q 325 190 345 210" fill="none" stroke="#FFE082" stroke-width="4" stroke-linecap="round"/>
    <path d="M 255 240 Q 285 230 305 250" fill="none" stroke="#FFE082" stroke-width="5" stroke-linecap="round"/>
    <path d="M 190 260 Q 215 245 235 270" fill="none" stroke="#FFE082" stroke-width="4" stroke-linecap="round"/>
    <path d="M 260 300 Q 285 290 310 315" fill="none" stroke="#FFE082" stroke-width="4" stroke-linecap="round"/>

    <!-- Pepper & Spice Flecks -->
    <circle cx="240" cy="195" r="3.5" fill="#B71C1C"/>
    <circle cx="290" cy="215" r="4" fill="#B71C1C"/>
    <circle cx="320" cy="260" r="3" fill="#B71C1C"/>
    <circle cx="260" cy="275" r="4.5" fill="#B71C1C"/>
    <circle cx="210" cy="285" r="3.5" fill="#B71C1C"/>
    <circle cx="295" cy="335" r="4" fill="#B71C1C"/>
    <circle cx="350" cy="290" r="3" fill="#B71C1C"/>
    <circle cx="340" cy="180" r="3.5" fill="#B71C1C"/>
  </g>
</svg>
